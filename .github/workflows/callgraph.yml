name: callgraph

# The call graph of upstream master that review.yml hands the reviewers as
# PR_REACH.md and `rtool reach`. GCC call-graph dumps and libclang, merged
# into a trailmark snapshot (callgraph/). Built once per master commit and
# version of callgraph/, in its own job with no secrets, and saved to the
# cache only if the gate passes.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: callgraph
  cancel-in-progress: false

env:
  UPSTREAM: monero-project/monero

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - name: Upstream master
        id: head
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/$UPSTREAM.git" refs/heads/master | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no master commit"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "master $sha"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: have
        with:
          path: ${{ runner.temp }}/callgraph/callgraph.json
          key: callgraph-${{ steps.head.outputs.sha }}-${{ hashFiles('harness/callgraph/**') }}
      - name: Fetch master
        if: steps.have.outputs.cache-hit != 'true'
        env:
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --no-tags --single-branch --branch master \
            "https://github.com/$UPSTREAM.git" src
          git -C src checkout -q "$SHA"
          git -C src -c protocol.allow=never -c protocol.https.allow=always \
            submodule update -q --init --recursive
      - name: Build, analyse and gate
        if: steps.have.outputs.cache-hit != 'true'
        timeout-minutes: 300
        run: |
          set -euo pipefail
          WORK="$PWD/callgraph-work" bash harness/callgraph/run.sh src "$RUNNER_TEMP/callgraph"
          ls -la "$RUNNER_TEMP/callgraph"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.have.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/callgraph/callgraph.json
          key: callgraph-${{ steps.head.outputs.sha }}-${{ hashFiles('harness/callgraph/**') }}
      # Every run, so the newest successful one always carries a graph for
      # review-local.sh.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: callgraph
          path: ${{ runner.temp }}/callgraph/
          if-no-files-found: ignore
          retention-days: 30
